<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COM3D2 Mods - Choose your characters</title>
<meta name="description" content="Every COM3D2 character mod. Pick up to 6 per month and copy your Discord request.">

</script>
<style>
:root{
  --ink:#111114; --ink2:#3d3d45; --mute:#8b8b94; --line:#ececf0; --line2:#dedee4;
  --page:#fff; --card:#fff; --pill:#f1f1f4; --sel:#111114; --accent:#ff4d6d; --ok:#16a34a;
  --hover:#fafafb; --segon:#fff; --ph:rgba(17,17,20,.22); --chkbg:rgba(255,255,255,.9); --ph-text:#9a9aa3;
  --bar:#111114; --bar2:#2a2a31; --bar3:#3b3b44; --shadow:rgba(17,17,20,.10);
  --r:16px; color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#f2f2f5; --ink2:#c9c9d1; --mute:#8d8d98; --line:#26262d; --line2:#34343c;
  --page:#0f0f12; --card:#17171c; --pill:#1f1f25; --sel:#f2f2f5;
  --hover:#18181d; --segon:#2d2d35; --ph:rgba(255,255,255,.18); --chkbg:rgba(23,23,28,.85); --ph-text:#6c6c76;
  --bar:#24242c; --bar2:#33333c; --bar3:#45454f; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0}
.panel{background:var(--page);padding:18px 20px 0;min-height:100vh;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
h1{margin:0;font-size:26px;font-weight:850;letter-spacing:-.02em}
.tier{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:7px 13px;font-weight:750;font-size:13px;color:var(--ink2);white-space:nowrap}
.tier b{color:var(--accent)}
.headr{display:flex;align-items:center;gap:10px}
.dc{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:#5865f2;color:#fff;text-decoration:none;font-weight:800;font-size:13px;white-space:nowrap}
.dc:hover{background:#4752c4}
.btn.dcb{display:inline-flex;align-items:center;gap:8px;background:#5865f2;color:#fff;text-decoration:none}
.btn.dcb:hover{background:#4752c4}
.theme{width:36px;height:36px;border-radius:50%;border:0;background:var(--pill);color:var(--ink2);cursor:pointer;display:grid;place-items:center;flex:none}
.theme:hover{color:var(--ink)}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
.steps{display:flex;gap:18px;flex-wrap:wrap;margin:-4px 0 12px;color:var(--mute);font-size:13px;font-weight:600}
.steps span b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--page);font-size:12px;margin-right:6px}
.tools{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line2);border-radius:var(--r);padding:0 16px;height:46px}
.search:focus-within{border-color:var(--ink)}
.search svg{flex:none;color:var(--ink2)}
.search input{border:0;outline:0;flex:1;font-size:16px;background:transparent;min-width:0}
.search input::placeholder{color:var(--ph-text)}
.seg{display:flex;background:var(--pill);border-radius:var(--r);padding:5px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:0 15px;font-weight:750;color:var(--ink2);cursor:pointer;font-size:14px}
.seg button.on{background:var(--segon);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.body{display:grid;grid-template-columns:230px 1fr;gap:18px;flex:1;min-height:0}
.side{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 60px);overflow:auto;padding-right:6px;scrollbar-width:thin}
.side button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700;font-size:14px;color:var(--ink2);border-radius:0}
.side button:hover{background:var(--hover)}
.side button .nm{flex:1;line-height:1.25}
.side button .ct{color:var(--mute);font-size:12px;font-weight:650}
.side button.on{background:var(--ink);color:var(--page);border-radius:12px;border-color:transparent;padding:11px 14px;margin-bottom:4px}
.side button.on .ct{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,max(122px,calc(158px*var(--k,1))));justify-content:start;gap:12px;align-content:start;padding-bottom:130px}
.card{position:relative;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--shadow)}
.card:focus-visible{outline:3px solid #6aa1ff;outline-offset:2px}
.card .art{height:calc(168px*var(--k,1));display:grid;place-items:start center;overflow:hidden;background:linear-gradient(160deg,var(--c1,#eef0ff),var(--c2,#fbe9f1))}
.card .art img{width:calc(138px*var(--k,1));height:calc(200px*var(--k,1));max-width:none;margin-top:6px;transition:transform .25s}
.card:hover .art img{transform:translateY(-3px)}
.card .ph{place-self:center;font-size:36px;font-weight:850;color:var(--ph)}
.card .meta{padding:8px 11px 9px}
.card .t{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .g{color:var(--mute);font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.card .n{color:var(--mute);font-size:12px;margin-top:3px;font-weight:600}
.card .new{position:absolute;left:8px;top:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:850;letter-spacing:.06em;border-radius:999px;padding:4px 9px}
.card .chk{position:absolute;right:8px;top:8px;width:24px;height:24px;font-size:13px;border-radius:50%;background:var(--chkbg);border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;font-weight:900}
.card.sel{border:2.5px solid var(--sel);box-shadow:0 8px 22px var(--shadow)}
.card.sel .chk{background:var(--sel);border-color:var(--sel);color:var(--page)}
.card.dim{opacity:.45}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0;font-weight:650}
.bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(140%);width:min(1100px,calc(100% - 24px));background:var(--bar);color:#fff;border-radius:20px;padding:14px 16px;border:1px solid var(--bar2);display:flex;gap:14px;align-items:center;box-shadow:0 18px 50px rgba(0,0,0,.35);transition:transform .2s;z-index:5}
.bar.show{transform:translateX(-50%) translateY(0)}
.bar .count{font-weight:850;font-size:15px;white-space:nowrap}
.bar .count b{font-size:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:6px;background:var(--bar2);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:650;max-width:220px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:var(--bar3);color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1;padding:0;flex:none}
.bar select{background:var(--bar2);border:0;color:#fff;border-radius:12px;height:44px;padding:0 10px;max-width:200px}
.btn{border:0;border-radius:13px;height:44px;padding:0 18px;font-weight:850;cursor:pointer;white-space:nowrap}
.btn.main{background:#fff;color:#111114}
.btn.alt{background:var(--bar2);color:#fff}
.toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-160%);background:var(--ok);color:#fff;font-weight:800;border-radius:12px;padding:12px 18px;transition:transform .2s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{color:var(--mute);font-size:13px;text-align:center;padding:10px 0 18px}
@media (max-width:900px){
  .panel{padding:14px 12px 0}
  .head{flex-wrap:wrap;gap:8px;margin-bottom:12px}
  h1{font-size:24px;white-space:nowrap}.tier{font-size:12px;padding:7px 11px}
  .steps{gap:6px 14px;font-size:13px}
  .dc span{display:none}.dc{padding:0 10px}
  .search{height:50px}.search input{font-size:17px}
  .bar{gap:8px;padding:10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{flex:none}
  .btn{height:40px;padding:0 13px}.bar select{height:40px}
  .tools{grid-template-columns:1fr}.seg{justify-self:start}
  .body{grid-template-columns:1fr;gap:12px}
  .side{position:static;display:flex;overflow-x:auto;max-height:none;gap:8px;padding-bottom:6px}
  .side button{flex:none;width:auto;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;margin:0}
  .side button.on{padding:8px 13px;margin:0;border-radius:999px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .bar{flex-wrap:wrap;bottom:8px;border-radius:16px}
  .chips{order:3;flex-basis:100%}
  .bar select{flex:1;max-width:none}
}
</style>
</head>

}
$("#theme").addEventListener("click", () => setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark", true));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
  let saved = null; try { saved = localStorage.getItem("catalog-theme"); } catch(err){}
  if (!saved) setTheme(e.matches ? "dark" : "light", false);
});

function renderSide(){
  const row = (g, n) => `<button data-g="${esc(g)}" class="${state.game===g?"on":""}"><span class="nm">${esc(g)}</span><span class="ct">${n}</span></button>`;
  $("#side").innerHTML = row("All", DATA.items.length) + gameNames.map(g => row(g, games[g].length)).join("");
}
function list(){
  const q = norm(state.q);
  let xs = state.game==="All" ? DATA.items.slice() : games[state.game].slice();
  if (q) xs = xs.filter(i => norm(i.t).includes(q) || norm(i.g).includes(q) || norm(i.id).includes(q));
  const az = (a,b) => a.t.localeCompare(b.t, undefined, {sensitivity:"base"});
  if (state.sort==="az") xs.sort(az);
  else if (state.sort==="new") xs.sort((a,b)=> (b.new-a.new) || (!!b.img-!!a.img) || az(a,b));
  else xs.sort((a,b)=> (b.n-a.n) || (!!b.img-!!a.img) || (b.new-a.new) || az(a,b));
  return xs;
}
function renderGrid(){
  const xs = list(), full = state.sel.length >= DATA.limit;
  $("#grid").innerHTML = xs.length ? xs.map(i => {
    const on = state.sel.includes(i.id), [c1,c2] = colorOf(i.g);
    const art = i.img ? `<img src="${i.img}" alt="" loading="lazy" decoding="async">` : `<span class="ph">${esc(i.t.slice(0,1).toUpperCase())}</span>`;
    return `<button class="card${on?" sel":""}${full&&!on?" dim":""}" data-id="${esc(i.id)}" aria-pressed="${on}" title="${esc(i.id)}" style="--c1:${c1};--c2:${c2}">
      <div class="art">${art}</div>${i.new?'<span class="new">NEW</span>':""}<span class="chk">&#10003;</span>
      <div class="meta"><div class="t">${esc(i.t)}</div><div class="g">${esc(i.g)}</div><div class="n">${i.n>=2?"Popular":"&nbsp;"}</div></div></button>`;
  }).join("") : `<div class="empty">No character found. Try another name.</div>`;
}
function renderBar(){
  $("#cn").textContent = state.sel.length;
  $("#chips").innerHTML = state.sel.map(id => `<span class="chip"><span>${esc(id)}</span><button data-rm="${esc(id)}" aria-label="Remove">&times;</button></span>`).join("");
  $("#bar").classList.toggle("show", state.sel.length > 0);
}
function command(){
  const bg = $("#bg").value;
  return `/request mods: ${state.sel.join(", ")}` + (bg ? ` bg: ${bg}` : "");
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("show"),1600); }
async function copy(text, label){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(label);
}
function toggle(id){
  const k = state.sel.indexOf(id);
  if (k >= 0) state.sel.splice(k,1);
  else if (state.sel.length >= DATA.limit) { toast(`Max ${DATA.limit} per month`); return; }
  else state.sel.push(id);
  renderGrid(); renderBar();
}

$("#side").addEventListener("click", e => { const b=e.target.closest("[data-g]"); if(!b) return; state.game=b.dataset.g; renderSide(); renderGrid(); window.scrollTo({top:0,behavior:"smooth"}); });
$("#grid").addEventListener("click", e => { const c=e.target.closest(".card"); if(c) toggle(c.dataset.id); });
$("#chips").addEventListener("click", e => { const b=e.target.closest("[data-rm]"); if(b) toggle(b.dataset.rm); });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on", x===b)); state.sort=b.dataset.sort; renderGrid(); }));
$("#q").addEventListener("input", e => { state.q=e.target.value; renderGrid(); });
$("#copyCmd").addEventListener("click", () => copy(command(), "Command copied - paste it on Discord"));
$("#copyList").addEventListener("click", () => copy(state.sel.join(", "), "Names copied - paste them in the mods box"));
$("#bg").insertAdjacentHTML("beforeend", DATA.bgs.map(b => `<option value="${esc(b)}">${esc(b.replace(/^BG_/,""))}</option>`).join(""));
$("#lim").textContent = DATA.limit;
for (const id of ["#dcHead", "#dcBar"]) { const a = $(id); if (DATA.discord) a.href = DATA.discord; else a.remove(); }
$("#chan").textContent = DATA.channel;
$("#foot").textContent = `${DATA.items.length} mods · updated ${DATA.built} · a mod you already got is resent for free`;
renderSide(); renderGrid(); renderBar();
</script>
</body>
</html>
